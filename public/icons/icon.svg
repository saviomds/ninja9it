<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0a0a"/>
  <rect width="512" height="512" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="rd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4a57"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>
  <!-- Ninja mask (scaled 15% larger, centred at 256,256) -->
  <ellipse cx="256" cy="226" rx="167" ry="150" fill="#141414" stroke="rgba(230,57,70,.4)" stroke-width="3"/>
  <!-- Eyes -->
  <rect x="157" y="186" width="69" height="32" rx="16" fill="url(#rd)"/>
  <rect x="286" y="186" width="69" height="32" rx="16" fill="url(#rd)"/>
  <!-- Headband -->
  <rect x="89" y="155" width="334" height="35" rx="9" fill="#e63946" opacity=".9"/>
  <!-- Number 9 -->
  <text x="256" y="410" font-family="Arial Black,sans-serif" font-weight="900"
        font-size="205" text-anchor="middle" fill="url(#rd)">9</text>
</svg>
